<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Кабінет викладача — Результати тесту</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #172033;
        }

        .container {
            width: min(1400px, calc(100% - 30px));
            margin: 30px auto;
        }

        .login-box {
            width: min(420px, 100%);
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .login-box h1 {
            margin-top: 0;
            text-align: center;
            font-size: 25px;
        }

        .login-box p {
            text-align: center;
            color: #64748b;
        }

        .login-box input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 17px;
            margin: 15px 0;
            outline: none;
        }

        .login-box input:focus {
            border-color: #2563eb;
        }

        button {
            border: 0;
            border-radius: 9px;
            padding: 11px 16px;
            font-size: 15px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        .login-button {
            width: 100%;
            font-size: 17px;
            padding: 13px;
        }

        .error {
            color: #dc2626;
            text-align: center;
            min-height: 22px;
            margin-top: 10px;
        }

        #dashboard {
            display: none;
        }

        .header {
            background: white;
            border-radius: 16px;
            padding: 22px 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header h1 {
            margin: 0;
            font-size: 27px;
        }

        .subject {
            margin-top: 7px;
            color: #64748b;
        }

        .logout-button {
            background: #64748b;
        }

        .logout-button:hover {
            background: #475569;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .stat-title {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
        }

        .controls {
            background: white;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search {
            flex: 1;
            min-width: 250px;
            padding: 11px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        .search:focus {
            border-color: #2563eb;
        }

        .refresh-button {
            background: #0f766e;
        }

        .refresh-button:hover {
            background: #115e59;
        }

        .csv-button {
            background: #7c3aed;
        }

        .csv-button:hover {
            background: #6d28d9;
        }

        .table-box {
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th,
        td {
            padding: 13px 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            white-space: nowrap;
        }

        th {
            background: #f8fafc;
            font-size: 13px;
            color: #475569;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .score {
            font-weight: bold;
        }

        .grade {
            font-weight: bold;
            text-align: center;
        }

        .grade-12,
        .grade-11,
        .grade-10 {
            color: #15803d;
        }

        .grade-9,
        .grade-8,
        .grade-7 {
            color: #2563eb;
        }

        .grade-6,
        .grade-5,
        .grade-4 {
            color: #ca8a04;
        }

        .grade-low {
            color: #dc2626;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-completed {
            background: #dcfce7;
            color: #166534;
        }

        .status-active {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status-interrupted {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }

        .loading {
            text-align: center;
            padding: 35px;
            color: #64748b;
        }

        .message {
            margin: 10px 0;
            color: #dc2626;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .container {
                width: calc(100% - 20px);
                margin: 15px auto;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 22px;
            }

            .controls {
                flex-direction: column;
            }

            .search {
                min-width: 0;
                width: 100%;
            }

            .controls button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<!-- ============================= -->
<!-- ВХІД -->
<!-- ============================= -->

<div id="loginScreen" class="login-box">

    <h1>Кабінет викладача</h1>

    <p>Результати тесту</p>

    <input
        type="password"
        id="teacherPassword"
        placeholder="Введіть пароль"
        autocomplete="current-password"
    >

    <button
        class="login-button"
        id="loginButton"
    >
        Увійти
    </button>

    <div id="loginError" class="error"></div>

</div>


<!-- ============================= -->
<!-- КАБІНЕТ -->
<!-- ============================= -->

<div id="dashboard">

    <div class="container">

        <div class="header">

            <div class="header-top">

                <div>
                    <h1>Результати тесту</h1>

                    <div class="subject">
                        Засоби комп'ютерних інформаційних систем
                    </div>
                </div>

                <button
                    class="logout-button"
                    id="logoutButton"
                >
                    Вийти
                </button>

            </div>

        </div>


        <!-- СТАТИСТИКА -->

        <div class="stats">

            <div class="stat">
                <div class="stat-title">
                    Усього студентів
                </div>

                <div
                    class="stat-value"
                    id="studentsCount"
                >
                    0
                </div>
            </div>


            <div class="stat">
                <div class="stat-title">
                    Усього спроб
                </div>

                <div
                    class="stat-value"
                    id="attemptsCount"
                >
                    0
                </div>
            </div>


            <div class="stat">
                <div class="stat-title">
                    Завершено
                </div>

                <div
                    class="stat-value"
                    id="completedCount"
                >
                    0
                </div>
            </div>

        </div>


        <!-- КЕРУВАННЯ -->

        <div class="controls">

            <input
                type="text"
                id="searchInput"
                class="search"
                placeholder="Пошук за кодом або ПІБ..."
            >

            <button
                class="refresh-button"
                id="refreshButton"
            >
                🔄 Оновити
            </button>

            <button
                class="csv-button"
                id="csvButton"
            >
                📥 CSV
            </button>

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <!-- ТАБЛИЦЯ -->

        <div class="table-box">

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>
                            <th>Код</th>
                            <th>ПІБ</th>
                            <th>Спроба</th>
                            <th>Бал</th>
                            <th>Оцінка</th>
                            <th>Статус</th>
                            <th>Початок</th>
                            <th>Завершення</th>
                        </tr>

                    </thead>

                    <tbody id="resultsBody">

                        <tr>
                            <td
                                colspan="8"
                                class="loading"
                            >
                                Завантаження...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://egovkavyxtcztisropsf.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_xteyS9yX00x-hZwLSdxgOg_D3ny6D-P";


/* =========================================================
   НАЛАШТУВАННЯ
   ========================================================= */

const TEACHER_PASSWORD = "1234";

const SESSION_KEY = "cis_teacher_logged_in_v1";


/* =========================================================
   ЗМІННІ
   ========================================================= */

let allResults = [];


/* =========================================================
   DOM
   ========================================================= */

const loginScreen =
    document.getElementById("loginScreen");

const dashboard =
    document.getElementById("dashboard");

const teacherPassword =
    document.getElementById("teacherPassword");

const loginButton =
    document.getElementById("loginButton");

const loginError =
    document.getElementById("loginError");

const logoutButton =
    document.getElementById("logoutButton");

const refreshButton =
    document.getElementById("refreshButton");

const csvButton =
    document.getElementById("csvButton");

const searchInput =
    document.getElementById("searchInput");

const resultsBody =
    document.getElementById("resultsBody");

const studentsCount =
    document.getElementById("studentsCount");

const attemptsCount =
    document.getElementById("attemptsCount");

const completedCount =
    document.getElementById("completedCount");

const message =
    document.getElementById("message");


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   ДАТА
   ========================================================= */

function formatDate(value) {

    if (!value) {
        return "—";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return "—";
    }

    return date.toLocaleString("uk-UA", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}


/* =========================================================
   СТАТУС
   ========================================================= */

function getStatusHtml(status) {

    if (status === "completed") {

        return `
            <span class="status status-completed">
                Завершено
            </span>
        `;
    }

    if (status === "active") {

        return `
            <span class="status status-active">
                Активна
            </span>
        `;
    }

    if (status === "interrupted") {

        return `
            <span class="status status-interrupted">
                Перервано
            </span>
        `;
    }

    return escapeHtml(status || "—");
}


/* =========================================================
   КЛАС ОЦІНКИ
   ========================================================= */

function getGradeClass(grade) {

    const value = Number(grade);

    if (value >= 10) {
        return "grade-12";
    }

    if (value >= 7) {
        return "grade-9";
    }

    if (value >= 4) {
        return "grade-6";
    }

    return "grade-low";
}


/* =========================================================
   ПОКАЗ ПОМИЛКИ
   ========================================================= */

function showMessage(text) {

    message.textContent = text || "";
}


/* =========================================================
   SUPABASE RPC
   ========================================================= */

async function supabaseRpc(functionName, body = {}) {

    const response = await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/${functionName}`,
        {
            method: "POST",

            headers: {
                "apikey": SUPABASE_ANON_KEY,
                "Authorization":
                    `Bearer ${SUPABASE_ANON_KEY}`,
                "Content-Type": "application/json"
            },

            body: JSON.stringify(body)
        }
    );

    const text = await response.text();

    let data = null;

    try {
        data = text ? JSON.parse(text) : null;
    } catch {
        data = text;
    }

    if (!response.ok) {

        let errorText = "Помилка Supabase";

        if (data?.message) {
            errorText = data.message;
        } else if (data?.error) {
            errorText = data.error;
        } else if (typeof data === "string" && data) {
            errorText = data;
        }

        throw new Error(errorText);
    }

    return data;
}


/* =========================================================
   ЗАВАНТАЖЕННЯ ВСІХ РЕЗУЛЬТАТІВ
   ========================================================= */

async function loadResults() {

    showMessage("");

    resultsBody.innerHTML = `
        <tr>
            <td colspan="8" class="loading">
                Завантаження результатів...
            </td>
        </tr>
    `;

    try {

        const data =
            await supabaseRpc(
                "get_all_test_attempts"
            );

        allResults =
            Array.isArray(data)
                ? data
                : [];

        renderResults();

    } catch (error) {

        console.error(error);

        resultsBody.innerHTML = `
            <tr>
                <td colspan="8" class="empty">
                    Не вдалося завантажити результати.
                </td>
            </tr>
        `;

        showMessage(
            "Помилка: " + error.message
        );
    }
}


/* =========================================================
   ВІДОБРАЖЕННЯ
   ========================================================= */

function renderResults() {

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const filtered =
        allResults.filter(row => {

            if (!search) {
                return true;
            }

            const code =
                String(row.student_code || "")
                    .toLowerCase();

            const name =
                String(row.student_name || "")
                    .toLowerCase();

            return (
                code.includes(search) ||
                name.includes(search)
            );
        });


    /* =========================
       СТАТИСТИКА
       ========================= */

    const uniqueStudents =
        new Set(
            allResults.map(
                row => row.student_code
            )
        );

    const completed =
        allResults.filter(
            row => row.status === "completed"
        );


    studentsCount.textContent =
        uniqueStudents.size;

    attemptsCount.textContent =
        allResults.length;

    completedCount.textContent =
        completed.length;


    /* =========================
       ПУСТО
       ========================= */

    if (filtered.length === 0) {

        resultsBody.innerHTML = `
            <tr>
                <td colspan="8" class="empty">
                    Результатів не знайдено.
                </td>
            </tr>
        `;

        return;
    }


    /* =========================
       ТАБЛИЦЯ
       ========================= */

    resultsBody.innerHTML =
        filtered.map(row => {

            const grade =
                row.grade ?? "—";

            const score =
                row.score !== null &&
                row.score !== undefined
                    ? `${row.score}/${row.max_score ?? 60}`
                    : "—";


            return `
                <tr>

                    <td>
                        <strong>
                            ${escapeHtml(row.student_code)}
                        </strong>
                    </td>

                    <td>
                        ${escapeHtml(row.student_name)}
                    </td>

                    <td>
                        ${escapeHtml(row.attempt_number)}
                    </td>

                    <td class="score">
                        ${escapeHtml(score)}
                    </td>

                    <td
                        class="grade ${getGradeClass(grade)}"
                    >
                        ${escapeHtml(grade)}
                    </td>

                    <td>
                        ${getStatusHtml(row.status)}
                    </td>

                    <td>
                        ${formatDate(row.started_at)}
                    </td>

                    <td>
                        ${formatDate(row.finished_at)}
                    </td>

                </tr>
            `;

        }).join("");
}


/* =========================================================
   CSV
   ========================================================= */

function csvEscape(value) {

    const text =
        String(value ?? "");

    return `"${text.replace(/"/g, '""')}"`;
}


function exportCSV() {

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const filtered =
        allResults.filter(row => {

            if (!search) {
                return true;
            }

            const code =
                String(row.student_code || "")
                    .toLowerCase();

            const name =
                String(row.student_name || "")
                    .toLowerCase();

            return (
                code.includes(search) ||
                name.includes(search)
            );
        });


    if (filtered.length === 0) {

        alert(
            "Немає результатів для експорту."
        );

        return;
    }


    const headers = [
        "Код",
        "ПІБ",
        "Спроба",
        "Бал",
        "Максимальний бал",
        "Оцінка",
        "Статус",
        "Початок",
        "Завершення",
        "IP"
    ];


    const rows =
        filtered.map(row => [

            row.student_code,

            row.student_name,

            row.attempt_number,

            row.score,

            row.max_score,

            row.grade,

            row.status,

            formatDate(row.started_at),

            formatDate(row.finished_at),

            row.ip_address

        ]);


    const csv = [

        headers.map(csvEscape).join(";"),

        ...rows.map(
            row =>
                row
                    .map(csvEscape)
                    .join(";")
        )

    ].join("\r\n");


    /* BOM для нормального відкриття
       українських символів у Excel */

    const blob =
        new Blob(
            ["\uFEFF" + csv],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "rezultaty_testu.csv";

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);
}


/* =========================================================
   ВХІД
   ========================================================= */

function login() {

    const password =
        teacherPassword.value;


    if (password !== TEACHER_PASSWORD) {

        loginError.textContent =
            "Неправильний пароль.";

        teacherPassword.select();

        return;
    }


    loginError.textContent = "";

    sessionStorage.setItem(
        SESSION_KEY,
        "true"
    );


    loginScreen.style.display =
        "none";

    dashboard.style.display =
        "block";


    loadResults();
}


/* =========================================================
   ВИХІД
   ========================================================= */

function logout() {

    sessionStorage.removeItem(
        SESSION_KEY
    );

    dashboard.style.display =
        "none";

    loginScreen.style.display =
        "block";

    teacherPassword.value = "";

    loginError.textContent = "";
}


/* =========================================================
   ПЕРЕВІРКА СЕСІЇ
   ========================================================= */

function checkSession() {

    const loggedIn =
        sessionStorage.getItem(
            SESSION_KEY
        );


    if (loggedIn === "true") {

        loginScreen.style.display =
            "none";

        dashboard.style.display =
            "block";

        loadResults();

    } else {

        loginScreen.style.display =
            "block";

        dashboard.style.display =
            "none";
    }
}


/* =========================================================
   ПОДІЇ
   ========================================================= */

loginButton.addEventListener(
    "click",
    login
);


teacherPassword.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            login();
        }

    }
);


logoutButton.addEventListener(
    "click",
    logout
);


refreshButton.addEventListener(
    "click",
    loadResults
);


csvButton.addEventListener(
    "click",
    exportCSV
);


searchInput.addEventListener(
    "input",
    renderResults
);


/* =========================================================
   СТАРТ
   ========================================================= */

checkSession();

</script>

</body>
</html>
